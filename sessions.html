<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Salapoliisi — Sessiot</title>
<link rel="stylesheet" href="css/base.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-wrap" id="login-view">
  <div class="card login-card">
    <h1>SALAPOLIISI · SESSIOT</h1>
    <div id="login-error" class="notice err" style="display:none;margin-bottom:.8rem"></div>
    <form id="login-form">
      <div class="field"><label>Sahkoposti</label><input class="input" id="l-email" type="email" required></div>
      <div class="field"><label>Salasana</label><input class="input" id="l-pass" type="password" required></div>
      <button class="btn primary" style="width:100%" type="submit">Kirjaudu</button>
    </form>
  </div>
</div>

<div class="page" id="sess-view" style="display:none">
  <div class="topbar">
    <h1>SALAPOLIISI · SESSIOT</h1>
    <nav>
      <a href="admin.html">HALLINTA</a>
      <a href="#" id="btn-refresh">PAIVITA</a>
      <a href="#" id="btn-logout">KIRJAUDU ULOS</a>
    </nav>
  </div>

  <div class="tabbar">
    <button class="tab on" data-tab="tab-sess">SESSIOT <span class="tab-n" id="n-sess"></span></button>
    <button class="tab" data-tab="tab-finals">RATKAISSEET <span class="tab-n" id="n-finals"></span></button>
    <button class="tab" data-tab="tab-wrong">VÄÄRÄT ARVAILUT</button>
  </div>

  <div id="tab-sess">
    <div class="row" style="margin-bottom:1rem">
      <input class="input grow" id="f-nick" placeholder="Suodata nimimerkilla...">
      <select class="input" id="f-status" style="width:auto">
        <option value="">Kaikki</option>
        <option value="done">Valmiit</option>
        <option value="open">Kesken</option>
      </select>
    </div>

    <table class="data" id="sess-table">
      <thead><tr><th>Nimimerkki</th><th>Edistys</th><th>Vihjeet</th><th>Aloitettu</th><th>Tila</th><th></th></tr></thead>
      <tbody></tbody>
    </table>

    <div id="detail" style="display:none">
      <h2 id="detail-title">Session tiedot</h2>
      <div id="detail-body"></div>
    </div>
  </div>

  <div id="tab-finals" style="display:none">
    <table class="data" id="finals-table">
      <thead><tr><th>#</th><th>Nimimerkki</th><th>Loppukoodi kirjattu</th><th>Sessio aloitettu</th><th>Kestoa</th></tr></thead>
      <tbody><tr><td colspan="5" class="muted">Ladataan...</td></tr></tbody>
    </table>
  </div>

  <div id="tab-wrong" style="display:none">
    <div class="card" id="agg"><span class="muted">Ladataan...</span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/sessions.js"></script>
</body>
</html>
