<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0e14">
<title>Mikkokalevin salapoliisitoimisto</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css?v=20251015l">
<link rel="stylesheet" href="css/game.css?v=20251015l">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="game-root">

  <!-- Ylapalkki -->
  <header class="g-header">
    <span class="logo">MIKKOKALEVIN SALAPOLIISITOIMISTO</span>
    <span class="status" id="conn-status">YHDISTETAAN</span>
    <span class="spacer"></span>
    <button class="hdr-btn" id="btn-board">TODISTEET</button>
    <button class="hdr-btn" id="btn-sound">ÄÄNI</button>
  </header>

  <!-- Chat-virta -->
  <div class="chat-scroll" id="chat"></div>

  <!-- Syottopalkki -->
  <div class="input-bar" id="inputbar" style="display:none">
    <input class="input" id="main-input" placeholder="Vastaus..." autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send">
    <button class="btn primary" id="main-send">➤</button>
  </div>
</div>

<!-- Boot-overlay -->
<div class="boot" id="boot">
  <div class="boot-inner">
    <img class="boot-img" src="logo.jpg" alt="Mikkokalevin salapoliisitoimisto">
    <div class="boot-logo">SALAPOLIISITOIMISTO</div>
    <div id="boot-lines"></div>
  </div>
</div>

<!-- Pulma-sheet -->
<div class="sheet-veil" id="veil"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="grab"></span>
    <h3 id="sheet-title">TEHTÄVÄ</h3>
    <button class="sheet-close" id="sheet-close">✕</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<!-- Firebase compat CDN -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/config.js?v=20251015l"></script>
<script src="js/firebase-init.js?v=20251015l"></script>
<script src="js/audio.js?v=20251015l"></script>
<script src="js/engine.js?v=20251015l"></script>
<script src="js/story.js?v=20251015l"></script>
<script src="js/steps/common.js?v=20251015l"></script>
<script src="js/steps/text.js?v=20251015l"></script>
<script src="js/steps/coords.js?v=20251015l"></script>
<script src="js/steps/lock.js?v=20251015l"></script>
<script src="js/steps/cipher.js?v=20251015l"></script>
<script src="js/steps/morse.js?v=20251015l"></script>
<script src="js/steps/wires.js?v=20251015l"></script>
<script src="js/steps/sequence.js?v=20251015l"></script>
<script src="js/steps/order.js?v=20251015l"></script>
<script src="js/steps/grid.js?v=20251015l"></script>
<script src="js/steps/mapClick.js?v=20251015l"></script>
<script src="js/steps/snake.js?v=20251015l"></script>
<script src="js/steps/breakout.js?v=20251015l"></script>
<script src="js/steps/runner.js?v=20251015l"></script>
<script src="js/steps/memory.js?v=20251015l"></script>
<script src="js/steps/slider15.js?v=20251015l"></script>
<script src="js/steps/mastermind.js?v=20251015l"></script>
<script src="js/steps/targets.js?v=20251015l"></script>
<script src="js/steps/catch.js?v=20251015l"></script>
<script src="js/steps/stack.js?v=20251015l"></script>
<script src="js/steps/maze.js?v=20251015l"></script>
<script src="js/steps/mines.js?v=20251015l"></script>
<script src="js/steps/flappy.js?v=20251015l"></script>
<script src="js/steps/hanoi.js?v=20251015l"></script>
<script src="js/steps/range.js?v=20251015l"></script>
<script src="js/steps/laser.js?v=20251015l"></script>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var bootEl = $("boot"), chatEl = $("chat"), inputbar = $("inputbar");
  var mainInput = $("main-input"), mainSend = $("main-send");
  var sheet = $("sheet"), veil = $("veil"), sheetBody = $("sheet-body"), sheetTitle = $("sheet-title");

  var soundOn = true;
  var inputMode = null; // "nick" | "final" | "chat" | null
  var busy = false;

  Story.init(chatEl);

  // Vapaan chatin syotto (Story.ask kayttaa)
  Story._inputFn = function () {
    return new Promise(function (resolve) {
      inputMode = "chat";
      showInput();
      mainInput.placeholder = "Kirjoita vastauksesi...";
      mainInput.focus();
      Story._chatResolve = resolve;
    });
  };

  function beep(fn) { if (soundOn && window.Audio) { try { fn(); } catch (e) {} } }

  // Inputbarin avaus: palkki vie tilaa, joten chat on vieritettava
  // pohjaan UUDELLEEN - myos nappaimiston avautumisen jalkeen.
  function showInput() {
    inputbar.style.display = "flex";
    [60, 300, 650].forEach(function (ms) {
      setTimeout(function () { Story.scroll(true); }, ms);
    });
  }

  // Nappaimisto avautuu/sulkeutuu -> visualViewport muuttuu -> scrollaa
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      if (inputbar.style.display !== "none") Story.scroll(true);
    });
  }

  // --- Boot-sekvenssi ---------------------------------------------
  // Versio poimitaan skripti-URL:sta (?v=...) - aina synkassa
  // cache-busterin kanssa ilman kasityota.
  var APP_VERSION = (function () {
    var s = document.querySelector('script[src*="config.js"]');
    var m = s && s.src.match(/[?&]v=([a-z0-9]+)/i);
    return m ? m[1] : "dev";
  })();

  var BOOT_LINES = [
    "> Versio " + APP_VERSION,
    "> Yhdistetään tutkintakanavaan...",
    "> TAPAUS GCBVFYZ — Mikkokalevin salapoliisitoimisto",
    "> Viitekoordinaatit: N 60° 58.190 E 025° 35.160",
    "> VIRHE: ei finaalisijainti — ratkaise ohjelmat ensin",
    "> Salaus käynnissä [AES-256]........ OK",
    "> Kanava auki. Tervetuloa, tutkija."
  ];

  var BOOT_PROGRESS_MS = 6000; // prosenttilaskurin kesto

  function runBoot(done) {
    var box = $("boot-lines");
    var i = 0;
    function finish() {
      bootEl.style.transition = "opacity .5s";
      bootEl.style.opacity = "0";
      setTimeout(function () { bootEl.style.display = "none"; done(); }, 520);
    }
    function progress() {
      var d = document.createElement("div");
      d.className = "boot-line cursor";
      d.textContent = "> Ladataan ohjelmat valmiiksi... 0%";
      box.appendChild(d);
      var start = Date.now();
      var iv = setInterval(function () {
        var p = Math.min(100, Math.floor((Date.now() - start) / BOOT_PROGRESS_MS * 100));
        d.textContent = "> Ladataan ohjelmat valmiiksi... " + p + "%";
        if (p >= 100) {
          clearInterval(iv);
          d.textContent = "> Ladataan ohjelmat valmiiksi... 100% — VALMIS";
          setTimeout(finish, 700);
        }
      }, 60);
    }
    function next() {
      if (i >= BOOT_LINES.length) {
        setTimeout(progress, 600);
        return;
      }
      var d = document.createElement("div");
      d.className = "boot-line cursor";
      d.textContent = BOOT_LINES[i];
      box.appendChild(d);
      beep(function () { window.Audio.tick(); });
      i++;
      setTimeout(next, 620);
    }
    next();
  }

  // --- Sheet (pulma-overlay) ---------------------------------------
  var sheetOpen = false;
  var activeCleanup = null; // pelin rAF/interval-siivous
  function openSheet(step) {
    if (sheetOpen) return;
    sheetOpen = true;
    sheetBody.innerHTML = "";
    sheetTitle.textContent = (step.title || "TEHTÄVÄ").toUpperCase();
    veil.classList.add("open");
    sheet.classList.add("open");
    document.body.classList.add("sheet-lock");
    renderStep(step);
  }
  function closeSheet() {
    sheetOpen = false;
    veil.classList.remove("open");
    sheet.classList.remove("open");
    document.body.classList.remove("sheet-lock");
    if (typeof activeCleanup === "function") {
      try { activeCleanup(); } catch (e) {}
      activeCleanup = null;
    }
  }
  veil.addEventListener("click", closeSheet);
  $("sheet-close").addEventListener("click", closeSheet);

  // --- Pulman renderointi -------------------------------------------
  function renderStep(step) {
    var api = {
      try: function (guess) {
        return Engine.submitGuess(step.id, guess).then(function (r) {
          if (r.ok) {
            beep(function () { window.Audio.success(); });
            setTimeout(function () {
              closeSheet();
              afterSolve(step, r);
            }, 350);
          } else if (!r.error) {
            beep(function () { window.Audio.error(); });
          }
          return r;
        });
      },
      hint: function () { return Engine.nextHint(step); },
      wrong: function () { return Engine.wrongCount(step.id); }
    };
    var fn = window.Steps[step.type];
    if (fn) {
      var c = fn(sheetBody, step, api);
      if (typeof c === "function") activeCleanup = c;
    } else {
      sheetBody.innerHTML = '<div class="notice err">Tuntematon pulmatyyppi: ' +
        String(step.type) + "</div>";
    }
  }

  // --- Pelivirta ----------------------------------------------------
  function afterSolve(step, r) {
    Story.system("✓ TODISTE RATKAISTU").then(function () {
      return Story.reward(
        r.reveal || "Hyvä työ. Tämä vie meitä eteenpäin.",
        r.codePart ? "KOODINPALA: " + r.codePart : null
      );
    }).then(function () {
      if (r.codePart) {
        return Story.handler(
          "Sait koodinpalan \u201C" + r.codePart + "\u201D. Kirjaa se ylös – tarvitset kaikkia paloja loppukoodiin.",
          { speed: 12 }
        );
      }
    }).then(playNext);
  }

  function playNext() {
    var step = Engine.currentStep();
    if (!step) {
      // Kaikki vaiheet ratkaistu -> loppukoodi
      finalPhase();
      return;
    }
    Story.runMessages(step.story || []).then(function () {
      Story.taskCard(step, function (s) {
        beep(function () { window.Audio.msg(); });
        openSheet(s);
      });
    });
  }

  // --- Loppukoodi ----------------------------------------------------
  function finalPhase() {
    if (Engine.isComplete()) {
      showEnding();
      return;
    }
    Story.runMessages([
      "Kaikki todisteet on ratkaistu. Erinomaista työtä, {nimi}.",
      "Sinulla on nyt kymmenen koodinpalaa — yksi koodi.",
      "Kirjoita tehtävien aikana saamasi koodi."
    ]).then(function () {
      inputMode = "final";
      showInput();
      mainInput.placeholder = "Koodi...";
      mainInput.focus();
    });
  }

  function showEnding() {
    Story.system("TAPAUS RATKAISTU").then(function () {
      var r = Engine.reveals["final"] || "";
      return Story.reward(r || "Onnittelut - tapaus on ratkaistu!", null);
    });
  }

  // --- Nimimerkki -----------------------------------------------------
  function askNickname() {
    return new Promise(function (resolve) {
      if (Engine.nickname) { resolve(); return; }
      Story.runMessages([
        { text: "TUTKINTAKANAVA AVATTU", type: "system" },
        "Tervetuloa. Tämä on Mikkokalevin salapoliisitoimiston suljettu tutkintakanava.",
        "Olen palkannut sinut erityiseen tehtävään - mutta ensin: millä nimimerkillä sinua kutsutaan?"
      ]).then(function () {
        inputMode = "nick";
        showInput();
        mainInput.placeholder = "Nimimerkkisi...";
        mainInput.focus();
      });
      Engine._nickResolve = resolve;
    });
  }

  function handleInput() {
    var v = mainInput.value.trim();
    if (!v) return;
    beep(function () { window.Audio.click(); });
    if (inputMode === "nick") {
      mainInput.value = "";
      Story.player(v);
      Engine.setNickname(v).then(function () {
        inputbar.style.display = "none";
        Story.handler("Kirjattu, " + Engine.nickname + ". Aloitetaan tutkinta.").then(function () {
          if (Engine._nickResolve) Engine._nickResolve();
        });
      });
    } else if (inputMode === "final") {
      Story.player(v);
      mainInput.value = "";
      tryFinalCodeVal(v);
    } else if (inputMode === "chat") {
      mainInput.value = "";
      inputbar.style.display = "none";
      inputMode = null;
      if (Story._chatResolve) {
        var r = Story._chatResolve;
        Story._chatResolve = null;
        r(v);
      }
    }
  }

  function tryFinalCodeVal(v) {
    if (busy) return;
    busy = true;
    Engine.submitGuess("final", v).then(function (r) {
      busy = false;
      if (r.ok) {
        inputbar.style.display = "none";
        beep(function () { window.Audio.success(); });
        Engine.markCompleted();
        showEnding();
      } else {
        beep(function () { window.Audio.error(); });
        Story.system("Väärä koodi. Tarkista koodinpalat.");
        if (navigator.vibrate) navigator.vibrate(120);
      }
    });
  }

  mainSend.addEventListener("click", handleInput);
  mainInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") handleInput();
  });

  // --- Todisteloki (case board) ---------------------------------------
  var boardSheet = false;
  function toggleBoard() {
    if (boardSheet) { closeSheet(); boardSheet = false; return; }
    boardSheet = true;
    sheetBody.innerHTML = "";
    sheetTitle.textContent = "TODISTELOKI";
    veil.classList.add("open");
    sheet.classList.add("open");
    document.body.classList.add("sheet-lock");
    sheetOpen = true;

    var solvedN = Engine.steps.filter(function (s) { return Engine.solved[s.id]; }).length;
    var head = document.createElement("div");
    head.className = "muted";
    head.style.cssText = "font-family:var(--mono);font-size:.8rem;margin-bottom:1rem";
    head.textContent = "Ratkaistu " + solvedN + " / " + Engine.steps.length +
      "  ·  koodi tähän mennessä: " + (Engine.assembledCode() || "-");
    sheetBody.appendChild(head);

    Engine.steps.forEach(function (st, i) {
      var row = document.createElement("div");
      var ok = Engine.solved[st.id];
      row.className = "board-item" + (ok ? "" : " locked");
      var n = document.createElement("span");
      n.textContent = (i + 1) + ". " + (st.title || st.id);
      var cp = document.createElement("span");
      cp.className = "cp";
      cp.textContent = ok ? (Engine.codeParts[st.id] || "-") : "····";
      row.appendChild(n); row.appendChild(cp);
      sheetBody.appendChild(row);
    });

    // Aloita alusta -nappi
    var reset = document.createElement("button");
    reset.className = "btn ghost";
    reset.style.cssText = "width:100%;margin-top:1.2rem;border-color:var(--err);color:var(--err)";
    reset.textContent = "ALOITA ALUSTA (menetät edistymisen)";
    reset.addEventListener("click", function () {
      if (confirm("Poistetaan koko edistymisesi ja aloitetaan peli alusta. Oletko varma?")) {
        Engine.resetProgress();
      }
    });
    sheetBody.appendChild(reset);
  }
  $("btn-board").addEventListener("click", function () {
    beep(function () { window.Audio.click(); });
    toggleBoard();
  });
  veil.addEventListener("click", function () { boardSheet = false; });
  $("sheet-close").addEventListener("click", function () { boardSheet = false; });

  // --- Aanikytkin ------------------------------------------------------
  var soundBtn = $("btn-sound");
  function paintSound() { soundBtn.textContent = soundOn ? "ÄÄNI: ON" : "ÄÄNI: OFF"; }
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    paintSound();
    if (soundOn) beep(function () { window.Audio.unlock(); window.Audio.click(); });
  });
  paintSound();

  // --- Kaynnistys --------------------------------------------------------

  // iOS Safari: user-scalable=no ei riita - estetaan pinch-zoom
  // gesture-tasolla. Leaflet-kartta (jos kaytossa) ohitetaan.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (e.target && e.target.closest && e.target.closest(".leaflet-container")) return;
      e.preventDefault();
    }, { passive: false });
  });

  document.body.addEventListener("pointerdown", function once() {
    beep(function () { window.Audio.unlock(); });
    document.body.removeEventListener("pointerdown", once);
  }, { once: true });

  // Testitila: ?testi ohittaa pelit PAIKALLISESTI ja menee suoraan
  // loppukoodin syottoon. Ratkaisut jatkossa kantaan vasta kun
  // loppukoodi syotetaan - taman voi testata vaarallisesti.
  var TEST_MODE = /[?&]testi\b/.test(location.search);
  if (TEST_MODE) {
    var _origInit = Engine.init;
    Engine.init = function () {
      return _origInit().then(function () {
        Engine.steps.forEach(function (s) { Engine.solved[s.id] = true; });
        Object.keys(Engine.solved).forEach(function (id) {
          Engine.codeParts[id] = Engine.codeParts[id] || "?";
        });
      });
    };
  }

  Engine.init().then(function () {
    $("conn-status").textContent = "ONLINE";
    runBoot(function () {
      askNickname().then(function () {
        if (Engine.isComplete()) {
          Story.system("Tervetuloa takaisin, " + Engine.nickname + ".");
          showEnding();
          return;
        }
        if (Object.keys(Engine.solved).length > 0) {
          Story.system("Jatketaan tutkintaa, " + Engine.nickname + ".");
        }
        playNext();
      });
    });
  }).catch(function (err) {
    bootEl.innerHTML = '<div class="boot-inner"><div class="boot-logo">SALAPOLIISI</div>' +
      '<div class="notice err">Yhteysvirhe: ' + (err && err.message ? err.message : err) +
      '<br><br>Varmista että Firebase-projekti on käytössä ja Anonymous-auth on päällä.</div></div>';
  });
})();
</script>
</body>
</html>
